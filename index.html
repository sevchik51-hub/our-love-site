<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fbf7f4" />
  <meta name="description" content="Наш маленький уголок: хотелки, места, отзывы, воспоминания и планы." />
  <title>Наше пространство</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♡</text></svg>">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-bg"></div>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Открыть меню" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <button class="brand" data-route="home" aria-label="На главную">
      <span class="brand-mark">♡</span>
      <span>
        <strong>Наши двое</strong>
        <small>только для нас</small>
      </span>
    </button>
    <button class="icon-btn" id="loginBtn" aria-label="Войти">
      <span class="login-dot"></span>
    </button>
  </header>

  <aside class="side-panel" id="sidePanel" aria-hidden="true">
    <div class="side-head">
      <div>
        <span class="eyebrow">НАВИГАЦИЯ</span>
        <h2>Наше пространство</h2>
      </div>
      <button class="icon-btn" id="closeMenu" aria-label="Закрыть меню">×</button>
    </div>
    <nav class="side-nav">
      <button data-route="home" class="nav-item active">⌂ <span>Главная</span></button>
      <button data-route="wishes" class="nav-item">♡ <span>Хотелки</span></button>
      <button data-route="places" class="nav-item">⌖ <span>Куда сходить</span></button>
      <button data-route="reviews" class="nav-item">★ <span>Рестораны и кафе</span></button>
      <button data-route="moments" class="nav-item">☻ <span>Смешные моменты</span></button>
      <button data-route="friends" class="nav-item">◎ <span>Встречи с друзьями</span></button>
      <button data-route="dates" class="nav-item">♡ <span>Идеи для свиданий</span></button>
      <button data-route="quotes" class="nav-item">“ <span>Наши фразы</span></button>
      <button data-route="gratitude" class="nav-item">✦ <span>Маленькие радости</span></button>
    </nav>
    <div class="side-foot">
      <div class="signed-as" id="signedAs">Гость</div>
      <button class="logout-btn hidden" id="logoutBtn">Выйти</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main id="app" class="page-shell"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="authDialog" class="auth-dialog">
    <form method="dialog" class="auth-card" id="authForm">
      <button type="button" class="dialog-close" id="authClose">×</button>
      <span class="eyebrow">ДОСТУП К ИЗМЕНЕНИЯМ</span>
      <h2>Кто сегодня за пультом?</h2>
      <p class="muted">Введи свой секретный код. Он нужен только для добавления и изменения записей.</p>
      <label class="field-label" for="secretCode">Секретный код</label>
      <input id="secretCode" class="field-input" type="password" autocomplete="off" placeholder="••••••••••••" required />
      <button class="primary-btn wide" id="authSubmit" type="submit">Войти</button>
      <p class="form-note" id="authNote"></p>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
